      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
  /auth/me:
    get:
      operationId: currentAccount
      description: Returns the current user without password hash, memberships, selected team, timezone and account-level preferences (locale). The user includes avatar_data, a local JPEG/PNG data URL or an empty string; user.name is the current team nickname.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
  /auth/profile:
    patch:
      operationId: updatePersonalProfile
      description: Saves the authenticated member's nickname in the current team and optionally their account-wide avatar. Agent credentials cannot modify profiles. Ownership comes from the browser session.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Current team nickname, 1–120 UTF-8 bytes.
                avatar_data:
                  type: string
                  maxLength: 90000
                  description: Empty string removes the avatar. Otherwise a PNG or JPEG base64 data URL, decoded size up to 65536 bytes and dimensions up to 256 x 256. External URLs and SVG are rejected. Omit to keep the existing avatar.
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
  /auth/password:
