openapi: 3.1.0
info:
  title: CoFlow API
  version: 0.1.5
  description: Team mode uses PostgreSQL accounts, HttpOnly browser sessions and per-member/team Agent Bearer Tokens.
    Explicit local-demo mode is isolated and requires no credentials. The server determines author and team; source_id
    is scoped to that identity.
servers:
- url: http://127.0.0.1:8080/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health and local-demo mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mode:
                    type: string
      security: []
  /meta:
    get:
      operationId: getMetadata
      responses:
        '200':
          description: Current authenticated member and team, members, projects, domains, role, mode and timezone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  domains:
                    type: array
                    items:
                      type: string
                  current_user:
                    type: string
                  mode:
                    type: string
                  timezone:
                    type: string
                  role:
                    type: string
                    enum:
                    - admin
                    - member
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  catalog:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                    description: Team mode category lifecycle and aliases. Includes merged rows for resolution history.
        '401':
          $ref: '#/components/responses/Error'
  /reports:
    get:
      operationId: listReports
      parameters:
      - name: project
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: member
        in: query
        schema:
          type: string
      - name: agent
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Reports ordered by creation time descending, including comments.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertReport
      description: Requires reports:write. Upserts for the current member/team; creation time and comments are preserved.
        Author/team fields in input cannot override identity. A deleted source_id returns 409 and cannot be recreated by upsert; restore requires an authorized web session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '200':
          description: Saved report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /reports/{id}:
    get:
      operationId: getReport
      description: Read an active report with visible comments in the authenticated current team. Used for locating shared reports; grants no additional access.
      security:
      - agentBearer: []
      - sessionCookie: []
      responses:
        '200':
          description: Active report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteReport
      description: Session-only author or team administrator soft-deletes a report. Requires latest updated_at; stale requests return 409. Repeated deletion is idempotent. Preserves content/history and hides report, discussion, collaboration and notifications from normal reads. Agent tokens are rejected.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_updated_at]
              properties:
                expected_updated_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Moved to trash
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      operationId: editReportContent
      description: Browser author or team administrator edits report content. Preserves source_id, author, Agent, Model and creation time. Requires expected_updated_at from the latest report; stale edits return 409. Changed classification is manually confirmed. Comments and history remain attached.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReportInput'
              - type: object
                required: [expected_updated_at, status, links, mentions, domains]
                properties:
                  expected_updated_at:
                    type: string
                    format: date-time
      responses:
        '200':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateReportStatus
      description: Requires reports:write. Authors may update their own records; browser administrators may update
        team records. An administrator Agent token does not inherit this additional privilege.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Updated report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /reports/{id}/comments:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  minLength: 1
                  description: Markdown; maximum 12000 UTF-8 bytes.
                mentions:
                  type: array
                  items: &id007
                    type: string
                  maxItems: 50
                  description: Existing member IDs to notify; separate from Markdown text.
      responses:
        '201':
          description: Saved comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      description: Requires comments:write for Agent credentials; browser members may comment.
  /auth/status:
    get:
      operationId: authStatus
      description: Returns mode and initialized. Setup is available only while no users exist.
      security: []
      responses:
        '200': &id002
          description: Successful result.
          content:
            application/json:
              schema:
                type: object
        '400': &id001
          $ref: '#/components/responses/Error'
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
  /auth/bootstrap/check:
    post:
      operationId: checkWorkspaceInitialization
      description: Validates the setup token before displaying onboarding, without consuming it or creating data.
        The browser obtains the token from its initialization URL parameter and sends it in a header.
        Returns 409 if already initialized. Creation independently validates the same token.
      security: []
      parameters:
      - in: header
        name: X-CoFlow-Setup-Token
        required: true
        schema:
          type: string
          minLength: 32
          writeOnly: true
      responses:
        '200': *id002
        '403': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /auth/bootstrap:
    post:
      operationId: initializeWorkspace
      parameters:
      - in: header
        name: X-CoFlow-Setup-Token
        required: true
        schema:
          type: string
          minLength: 32
          writeOnly: true
      description: One-time workspace/admin creation, serialized in a database transaction; sets a browser session
        cookie. Requires the server-configured COFLOW_BOOTSTRAP_TOKEN (at least 32 characters). Missing
        or weak server configuration blocks setup with 503. Incorrect or absent header returns 403.
        Once initialized, the token cannot create another administrator (409).
      security: []
      responses:
        '201': *id002
        '503': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name: &id003
                  type: string
                password: &id004
                  type: string
                  writeOnly: true
                  minLength: 8
                  maxLength: 72
                team_name: *id003
              required:
              - email
              - name
              - password
              - team_name
  /auth/login:
    post:
      operationId: login
      description: Verifies password and sets session cookie. No public account signup; new users require an invitation.
      security: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password: *id004
              required:
              - email
              - password
  /auth/logout:
    post:
      operationId: logout
      description: Revokes the current session and clears its cookie.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
  /auth/me:
    get:
      operationId: currentAccount
      description: Returns the current user without password hash, memberships, selected team, timezone and account-level preferences (locale). The user includes avatar_data, a local JPEG/PNG data URL or an empty string; user.name is the current team nickname.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
  /auth/profile:
    patch:
      operationId: updatePersonalProfile
      description: Saves the authenticated member's nickname in the current team and optionally their account-wide avatar. Agent credentials cannot modify profiles. Ownership comes from the browser session.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Current team nickname, 1–120 UTF-8 bytes.
                avatar_data:
                  type: string
                  maxLength: 90000
                  description: Empty string removes the avatar. Otherwise a PNG or JPEG base64 data URL, decoded size up to 65536 bytes and dimensions up to 256 x 256. External URLs and SVG are rejected. Omit to keep the existing avatar.
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
  /auth/password:
    post:
      operationId: changeOwnPassword
      description: Verifies the current password, changes the account password and revokes other browser sessions atomically. The current session and existing Agent credentials are retained. Requires a browser session and is rate limited.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                  description: 8–72 UTF-8 bytes and different from the current password.
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
  /auth/preferences:
    get:
      operationId: getPersonalPreferences
      description: Returns the current account language (en by default) and display_timezone (Asia/Shanghai by default). Shared across the account's teams and sessions.
        Requires a browser session; Agent credentials cannot access personal preferences.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Personal preferences.
          content:
            application/json:
              schema: &preferences
                type: object
                required: [locale, display_timezone]
                properties:
                  locale:
                    type: string
                    enum: [en, zh-CN]
                    default: en
                  display_timezone:
                    type: string
                    default: Asia/Shanghai
                    description: Valid IANA time zone or UTC. Controls display and day grouping only; does not change team time zone or stored timestamps.
        '401': *id001
        '403': *id001
    patch:
      operationId: setPersonalPreferences
      description: Updates the authenticated account's language and/or display_timezone; omitted fields are preserved. Invalid or Local time zones are rejected. No user or team ID is accepted as an ownership selector.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
              - required: [locale]
              - required: [display_timezone]
              properties:
                locale:
                  type: string
                  enum: [en, zh-CN]
                display_timezone:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Saved preferences.
          content:
            application/json:
              schema: *preferences
        '400': *id001
        '401': *id001
        '403': *id001
  /auth/team:
    post:
      operationId: selectTeam
      description: Changes the session team only if the current account is a member. Agent Tokens retain their bound
        team.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id: *id003
              required:
              - team_id
  /auth/invite-info:
    post:
      operationId: invitationInfo
      description: Reads a valid invitation's target email, email_domain, inviter_name (team display name), team_name and expiry. Inviter email and account ID are not exposed. Full invitation links use a URL fragment,
        not a server query parameter.
      security: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: &id005
                  type: string
                  writeOnly: true
              required:
              - token
  /auth/accept-invite:
    post:
      operationId: acceptInvitation
      description: Atomically consumes a seven-day, single-use invite. New accounts need name/password. Existing
        accounts must have a matching login or supply the original password; never resets an account password.
      security: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: *id005
                name: *id003
                password: *id004
              required:
              - token
  /invites:
    get:
      operationId: listInvitations
      description: Admins see team invitations; members see invitations they created. No secret returned.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
    post:
      operationId: createInvitation
      description: Members may invite by email. Returns invite metadata and full token only at creation; share /invite#invite=<token>
        manually.
      security:
      - sessionCookie: []
      responses:
        '201': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
  /invites/{id}:
    delete:
      operationId: revokeInvitation
      description: Creator or admin may revoke an unused invitation.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
    parameters:
    - name: id
      in: path
      required: true
      schema: *id003
  /members/{id}:
    patch:
      operationId: updateMemberRole
      description: Browser administrators may set a current-team member role to admin or member, including their own. The last administrator cannot be demoted. Agent tokens cannot change roles. Role changes apply to subsequent requests.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
    delete:
      operationId: removeMember
      description: Browser admins may remove non-admin members. Their sessions and tokens immediately stop authorizing
        team access.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
    parameters:
    - name: id
      in: path
      required: true
      schema: *id003
  /tokens:
    get:
      operationId: listPersonalTokens
      description: Lists only the current member/team tokens, prefixes, scopes, expiry, last-used and revocation
        state. Never returns credential or hash.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
    post:
      operationId: createPersonalToken
      description: Returns credential in full once, plus token metadata. Reports read is required; default scopes
        read/report. Raw token is never stored.
      security:
      - sessionCookie: []
      responses:
        '201': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id003
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                    - reports:read
                    - reports:write
                    - comments:write
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
              required:
              - name
  /tokens/{id}:
    delete:
      operationId: revokePersonalToken
      description: Only token owner in its bound team may revoke. Effective on the next request.
      security:
      - sessionCookie: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
    parameters:
    - name: id
      in: path
      required: true
      schema: *id003
  /catalog:
    get:
      operationId: listCatalog
      description: Team mode only. Requires reports:read. Includes pending, archived and merged classifications.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400': &id006
          $ref: '#/components/responses/Error'
        '401': *id006
        '403': *id006
        '404': *id006
  /catalog/{kind}:
    post:
      operationId: createCategory
      description: Browser team members create a formal or pending category. Names/aliases must be unique after
        case/whitespace normalization.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: &id008
              type: object
              properties:
                name:
                  type: string
                  maxLength: 160
                aliases:
                  type: array
                  maxItems: 50
                  items: *id007
                state:
                  enum:
                  - active
                  - pending
                  - archived
              required:
              - name
    parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - project
        - domain
  /catalog/{kind}/order:
    put:
      operationId: reorderCatalog
      description: Browser members save the complete non-merged category order for the current team and kind. Includes archived rows. Duplicate, foreign or stale lists are rejected atomically. GET catalog and meta use this order.
      security:
      - sessionCookie: []
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [project, domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Order saved
        '400': *id006
        '401': *id006
        '403': *id006
  /catalog/{kind}/{id}:
    patch:
      operationId: updateCategory
      description: Browser members rename, approve, archive, restore or edit aliases. Renaming retains the previous
        name as an alias and audits affected reports.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: *id008
    parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - project
        - domain
    - name: id
      in: path
      required: true
      schema:
        type: string
  /catalog/{kind}/{id}/merge:
    post:
      operationId: mergeCategory
      description: Atomically reclassifies historical reports and keeps source name/aliases pointing to an active
        destination. Original report text and input preserved.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_id: *id007
              required:
              - target_id
    parameters:
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - project
        - domain
    - name: id
      in: path
      required: true
      schema:
        type: string
  /reports/{id}/classification:
    patch:
      operationId: correctReportClassification
      description: Browser members correct classification and lock it against subsequent Agent upserts. Team scoped.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: *id007
                domains: &id009
                  type: array
                  items: *id007
              required:
              - project_id
              - domains
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /reports/{id}/history:
    get:
      operationId: getReportHistory
      description: Requires reports:read. Newest 100 report creation, revision and classification snapshots. Team
        scoped.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *id007
                        actor_id: *id007
                        action: *id007
                        before:
                          $ref: '#/components/schemas/Report'
                        after:
                          $ref: '#/components/schemas/Report'
                        created_at: *id007
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /collaborations:
    get:
      operationId: listCollaborations
      description: Requires reports:read. Team requests with chronological progress updates.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collaboration'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
    post:
      operationId: createCollaboration
      description: Requires comments:write. Report and assignee must belong to the current team; notifies assignee.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id: *id007
                assignee_id: *id007
                title:
                  type: string
                  maxLength: 600
                body:
                  type: string
                  maxLength: 12000
              required:
              - report_id
              - assignee_id
              - title
  /collaborations/{id}:
    patch:
      operationId: updateCollaboration
      description: Requires comments:write. Only creator, assignee, or browser admin may append progress/change
        status. Notifies other participants.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: &id010
                  enum:
                  - open
                  - in_progress
                  - blocked
                  - done
                  - cancelled
                body:
                  type: string
                  maxLength: 12000
              required:
              - status
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /notifications:
    get:
      operationId: listNotifications
      description: Browser only. Latest 200 notifications for the current user and team; polls every 30 seconds
        in UI. No external messages.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
  /notifications/read:
    post:
      operationId: markNotificationsRead
      description: Browser only. Mark one notification read; omit id to mark current user/team inbox read.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: *id007
  /reads:
    get:
      operationId: listReadReceipts
      description: Browser only. Current member/team read timestamps, shared across devices.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    additionalProperties:
                      type: string
                      format: date-time
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
  /reports/{id}/read:
    post:
      operationId: markReportRead
      description: Browser only. Supply the timestamp actually displayed; concurrent later updates remain unread.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seen_at:
                  type: string
                  format: date-time
              required:
              - seen_at
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /teams:
    post:
      operationId: createTeam
      description: Browser only. Create a team with current member as admin and switch this session to it. Existing
        Agent Tokens keep their original team.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id007
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id007
                display_name:
                  type: string
                  description: Optional team-specific name for the creating member. Defaults to the account name.
              required:
              - name
  /reports/trash:
    get:
      operationId: listDeletedReports
      description: Session-only. Lists deleted reports authored by the current member, or all in the current team for its administrator. Does not grant access to other teams.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Deleted reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
        '403':
          $ref: '#/components/responses/Error'
  /reports/{id}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      operationId: restoreReport
      description: Session-only author or team administrator restores the original report and its existing associations. Separately deleted comments stay deleted. Idempotent; no new source_id or duplicate report.
      security:
      - sessionCookie: []
      responses:
        '200': {description: Restored}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/trash:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: listDeletedComments
      description: Session-only. Lists own deleted comments on an active current-team report, or all its deleted comments for a team administrator.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Deleted comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '403': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/{comment}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    - name: comment
      in: path
      required: true
      schema: {type: string}
    delete:
      operationId: deleteComment
      description: Session-only comment author or team administrator soft-deletes a comment on an active report. Idempotent; records the actor and comment ID without exposing deleted text in history.
      security:
      - sessionCookie: []
      responses:
        '200': {description: Moved to trash}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/{comment}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    - name: comment
      in: path
      required: true
      schema: {type: string}
    post:
      operationId: restoreComment
      description: Session-only comment author or team administrator restores a comment on an active report. Idempotent; deleted parent reports must be restored separately.
      security:
      - sessionCookie: []
      responses:
        '200': {description: Restored}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: A validation, ownership or storage error.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
  schemas:
    Status:
      type: string
      enum:
      - progress
      - review
      - blocked
      - delivered
      - resolved
    Link:
      type: object
      required:
      - url
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https?://
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        color:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        status:
          type: string
    ReportInput:
      type: object
      required:
      - title
      properties:
        source_id:
          type: string
          description: Stable key for retries; maximum 200 UTF-8 bytes.
        title:
          type: string
          minLength: 1
          description: Maximum 600 UTF-8 bytes.
        body:
          type: string
          description: Markdown; maximum 60000 UTF-8 bytes.
        project_id:
          type: string
          description: Existing project ID; empty means unassigned.
        domain:
          type: string
          description: Legacy single-domain name. Team mode accepts alongside domains; resolved and deduplicated.
            Demo still accepts only configured names.
        agent:
          type: string
          description: Descriptive tool name; maximum 100 UTF-8 bytes.
        model:
          type: string
          description: Optional model name; maximum 100 UTF-8 bytes.
        status:
          $ref: '#/components/schemas/Status'
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Link'
        mentions:
          type: array
          items:
            type: string
          description: Existing member IDs.
        project_name:
          type: string
          maxLength: 160
          description: 'Team mode: exact normalized name/alias matching; unknown names become pending proposals.
            Leave empty when uncertain. project_id takes precedence.'
        domains:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 160
          description: 'Team mode: multiple domain names/aliases. Unknown names become pending proposals; archived
            names rejected.'
    Report:
      allOf:
      - $ref: '#/components/schemas/ReportInput'
      - type: object
        properties:
          id:
            type: string
          team_id:
            type: string
            readOnly: true
          author_id:
            type: string
            readOnly: true
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          comments:
            type: array
            items:
              $ref: '#/components/schemas/Comment'
          deleted_at:
            type: string
            format: date-time
            readOnly: true
            description: Present only in session-authorized trash results.
          classification_input:
            type: object
            description: Original classification supplied by the Agent. Preserved by human correction and merges.
          classification_locked:
            type: boolean
            readOnly: true
            description: Human-corrected classification is retained on later Agent upserts.
    Comment:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          description: Present only in session-authorized trash results.
        id:
          type: string
        report_id:
          type: string
        author_id:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id: *id007
        kind:
          enum:
          - project
          - domain
        name: *id007
        aliases: *id009
        state:
          enum:
          - active
          - pending
          - archived
          - merged
        merged_into: *id007
    CollaborationUpdate:
      type: object
      properties:
        id: *id007
        actor_id: *id007
        status: *id007
        body: *id007
        created_at:
          type: string
          format: date-time
    Collaboration:
      type: object
      properties:
        id: *id007
        report_id: *id007
        author_id: *id007
        assignee_id: *id007
        title: *id007
        body: *id007
        status: *id010
        created_at: *id007
        updated_at: *id007
        updates:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationUpdate'
    Notification:
      type: object
      properties:
        id: *id007
        report_id: *id007
        request_id: *id007
        kind: *id007
        title: *id007
        created_at: *id007
        read_at:
          type:
          - string
          - 'null'
          format: date-time
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: coflow_session
      description: HttpOnly SameSite=Lax browser session, seven-day expiry.
    agentBearer:
      type: http
      scheme: bearer
      description: Personal Agent token, returned in full only at creation. Required scope depends on operation.
security:
- sessionCookie: []
- agentBearer: []
