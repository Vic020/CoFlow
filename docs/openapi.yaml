      parameters:
      - in: header
        name: X-CoFlow-Setup-Token
        required: true
        schema:
          type: string
          minLength: 32
          writeOnly: true
      responses:
        '200': *id002
        '403': *id001
        '409': *id001
        '429': *id001
        '503': *id001
