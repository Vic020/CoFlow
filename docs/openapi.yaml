openapi: 3.1.0
info:
  title: CoFlow API
  version: 0.5.2
  description: Team mode uses PostgreSQL accounts, HttpOnly browser sessions and per-member/team Agent Bearer Tokens.
    Explicit local-demo mode is isolated and requires no credentials. The server determines author and team; source_id
    is scoped to that identity.
servers:
- url: http://127.0.0.1:8080/api/v1
paths:
  /context-graph:
    get:
      operationId: readContextGraph
      description: 'Requires context:read and original source read scopes. Filters select
        visible Context roots; directly linked sources/parentage and explicit Todo-report
        or Calendar links are included only when readable, possibly outside root filters.
        Metadata only: no bodies, quotes or histories. Default excludes archived roots.
        Caps 120 roots, 600 nodes, 2400 edges; inspect truncated. Not a semantic similarity
        graph.'
      parameters:
      - name: project
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: member
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Authorized knowledge relationships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraph'
        '403':
          $ref: '#/components/responses/Error'
  /assistant/context-auto:
    post:
      operationId: automaticallyOrganizeContext
      security:
      - sessionCookie: []
      description: 'One-click browser mandate for scoped automatic Context maintenance
        only. Verified model required. Auto saves and activates current sourced knowledge;
        stale/pending sources retain review status. Partial writes are possible: inspect
        errors and reuse the same request_id on uncertain retries. No original module
        writes, web, MCP or schedules. Not available to Agent Tokens.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - config_id
              properties:
                request_id:
                  type: string
                  maxLength: 100
                config_id:
                  type: string
                project:
                  type: string
                domain:
                  type: string
                member:
                  type: string
                source_kind:
                  type: string
                  enum:
                  - todo
                  - report
                  - calendar
                  - context
                source_id:
                  type: string
                locale:
                  type: string
                mode:
                  type: string
                  enum:
                  - extract
                  - organize
      responses:
        '200':
          description: Actual saved items and partial errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                  reply:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextEntry'
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /context-tree:
    get:
      operationId: readContextTree
      description: Requires context:read and original source scopes, including transitive
        Context sources. Permission-filtered metadata only, up to the team cap of 1000;
        not full document content. Unavailable parents are projected as roots. Supports
        q/kind/source filtering for progressive exploration. Filtered parents may be
        omitted; never reconstruct inaccessible ancestors. Results contain metadata
        only, not evidence that bodies were read.
      parameters:
      - name: project
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: member
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Visible Wiki directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextNode'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Error'
  /context:
    get:
      operationId: listContext
      description: Requires context:read plus the original module read scopes for linked
        sources. Personal entries are creator-only. Unreadable/deleted source content
        is omitted, including from totals. Offset pagination, literal case-insensitive
        search; needs_review and future validity must be checked before model use.
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: project
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: member
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      - name: offset
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContextEntry'
                  total:
                    type: integer
                  next_offset:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createContext
      description: Requires context:read/write. A stable source_id per creator and operation_id
        prevent duplicate extraction. Tokens save pending only. Go captures or validates
        source versions. Does not modify original modules. Known credential patterns
        are rejected; never submit credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInput'
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextEntry'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /context/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: readContext
      description: Requires context:read and source permissions. Current and historical
        content are checked separately; sharing an entry does not share old private
        snapshots.
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextEntry'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: changeContext
      description: Creator or browser administrator for team entries. Edits require
        the COMPLETE editable document and expected_revision. Archive/restore/merge
        accept lifecycle metadata. Restore returns pending. Merge retains target body,
        combines sources and archives this record; target_revision is required. Explicit
        source review must actually read changed originals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInput'
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextEntry'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /delegations:
    get:
      operationId: listDelegations
      description: Requires todos:read. Only current grantor/grantee or browser administrator
        sees grants. Expired/revoked records remain visible. No token scopes or execution
        authority are implied.
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delegation'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: grantDelegation
      security:
      - sessionCookie: []
      description: Human session only. One current-team member, one task or administrator-owned
        project, explicit actions and expiry within 90 days. Rechecks grantor authority
        on every delegated write. Does not delegate ownership, review decisions, blockers,
        notifications or agent dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationInput'
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /delegations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      operationId: revokeDelegation
      security:
      - sessionCookie: []
      description: Grantor or browser administrator revokes with action=revoke, expected_revision
        and operation_id. Changed scope must be revoked and granted anew.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationInput'
      responses:
        '200':
          description: Visible current-team result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /assistant/web-configs:
    get:
      operationId: listWebConfigs
      security: [{sessionCookie: []}]
      description: Independent search/fetch credentials. Lists the account's personal configurations across workspaces and the current team's shared configurations. Keys and encryption contexts are never returned. Team members may use shared configs; only admins edit them. Personal configs are usable/editable only by their owner. Default is scoped to account or team, separate from model settings.
      responses:
        '200':
          description: Web service metadata and encryption readiness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  items: {type: array, items: {$ref: '#/components/schemas/WebConfig'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createWebConfig
      security: [{sessionCookie: []}]
      description: A valid matching draft verification proof is required. Saves an independent encrypted key; never copies a model key. Official provider endpoints only. No custom Base URL, background browsing or automatic provider fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebConfigWrite'}
      responses:
        '200':
          description: Saved web configuration metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /assistant/web-configs/verify:
    post:
      operationId: verifyWebConfigDraft
      security: [{sessionCookie: []}]
      description: Sends one public search and one example.com fetch using the selected provider; charges may apply. Does not save a key or draft. Reuses an owned/editable saved key only for the same provider and expected revision. Returns verification_token and expires_at, valid for ten minutes and bound to config ID, revision, scope, provider, key and account (personal) or account/team (shared). Domain-separated from model verification. Saving a matching proof does not repeat requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebConfigWrite'}
      responses:
        '200':
          description: Short-lived verification proof.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /assistant/web-configs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      operationId: editWebConfig
      security: [{sessionCookie: []}]
      description: Expected revision and ownership/admin permission required. Existing verification survives only a name/default edit with the same provider and key. New provider requires a new explicit key; connection changes require fresh proof. Revision changes invalidate in-flight browsing before saving the turn.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebConfigWrite'}
      responses:
        '200':
          description: Updated web configuration metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteWebConfig
      security: [{sessionCookie: []}]
      description: Expected revision and ownership/admin permission required. History and external source records remain. Does not revoke the vendor key; future and in-flight turns revalidate access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Configuration removed.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/models:
    post:
      operationId: discoverAssistantModels
      security: [{sessionCookie: []}]
      description: Browser-session model discovery for an unsaved form. GETs the supplied public HTTPS Base URL plus /models using the provider's OpenAI-compatible list format (data[].id). GLM and custom endpoints are capability probes, not promises of listing support. Requires an explicit key, or an editable saved config with matching provider and canonical Base URL and expected_revision. Team members cannot reuse an administrator's key here. Does not save, verify, select, or generate text. Rate-limited and limited to 12 seconds, 1 MiB, and 500 IDs; upstream pagination is not followed. Uses the same DNS/private-network and redirect protection as model calls. Errors never echo upstream response bodies or credentials. An empty list or error leaves the UI's suggestions/custom input usable; returned IDs do not imply Responses or tool compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, base_url]
              properties:
                provider: {type: string, enum: [deepseek, glm, openai, compatible]}
                base_url: {type: string, format: uri}
                api_key: {type: string, writeOnly: true, maxLength: 4096}
                config_id: {type: string}
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Sorted, deduplicated model IDs from the service; no configuration or secret is returned.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: {type: array, maxItems: 500, items: {type: string, maxLength: 150}}
                  truncated: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /assistant/configs:
    get:
      operationId: assistantConfigs
      security: [{sessionCookie: []}]
      description: Browser session only. Lists this team's shared settings and this account's global personal settings, never keys. Shared settings are usable by team members, editable only by admins. Personal configuration and its default are account scoped and available across workspaces; other members/admins cannot access them. Explicit model selection, histories and jobs remain member/team scoped. configured reports whether a server encryption key is present; selection may refer to a removed configuration and must not silently fall back.
      responses:
        '200':
          description: Configuration metadata and current personal selection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AIConfig'}}
                  configured: {type: boolean}
                  selected_config_id: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createAssistantConfig
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIConfigWrite'}
      responses:
        '200':
          description: Saved metadata; verified when a valid matching pre-save proof is supplied. API key encrypted using AES-GCM with server key, configuration ID and account binding for personal keys, or configuration ID and team binding for shared keys. Legacy personal ciphertext retains its original associated-data context until edited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /assistant/configs/verify:
    post:
      operationId: verifyAssistantConfigDraft
      security: [{sessionCookie: []}]
      description: Verify an unsaved browser configuration before saving. Reuses AIConfigWrite plus optional id and expected_revision for an editable existing config. Checks current permissions and revision, reuses a saved key only for the same provider and canonical Base URL. Sends one minimal provider request without business context or tools; may incur cost. Does not persist a draft/key or mutate saved verified_at. Returns a signed 10-minute proof bound to the account for personal scope or team/member for team scope, config ID, revision, scope, provider, protocol, URL, model and actual key. Saving a valid proof sets verified_at without another provider request; changed, expired or forged proofs are rejected. Only metadata/name/default edits retain an existing verification. Existing save clients without proofs remain compatible but cannot claim a new/changed connection is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/AIConfigWrite'}
              - type: object
                properties:
                  id: {type: string, description: Optional existing editable configuration ID.}
      responses:
        '200':
          description: Transient verification proof, not a saved configuration or plaintext key.
          content:
            application/json:
              schema:
                type: object
                required: [verification_token, expires_at]
                properties:
                  verification_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /assistant/configs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      operationId: editAssistantConfig
      security: [{sessionCookie: []}]
      description: Requires expected_revision. Cannot change ownership or scope. Empty api_key preserves the existing key. Editing invalidates connection verification. No key is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIConfigWrite'}
      responses:
        '200':
          description: Updated metadata, requiring verification before use.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIConfig'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAssistantConfig
      security: [{sessionCookie: []}]
      description: Deletes only this editable configuration. Existing work and conversations remain. Deletion never selects another key automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                expected_revision: {type: integer}
      responses:
        '200': {description: Deleted}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/configs/{id}/verify:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: verifyAssistantConfig
      security: [{sessionCookie: []}]
      description: Legacy saved-configuration verification. Already-verified configurations return metadata without another provider request; the UI uses pre-save verification instead. Minimal provider request without work context. Configuration must be editable by this session. This may incur provider cost. No upstream error body is exposed. Public HTTPS endpoints only, no private IPs, redirects or environment proxies.
      responses:
        '200':
          description: Verified metadata if the revision is still current.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /assistant/preference:
    patch:
      operationId: selectAssistantConfig
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_id]
              properties:
                config_id: {type: string}
      responses:
        '200': {description: Saved this member's choice within the current team, after validating access.}
        '404': {$ref: '#/components/responses/Error'}
  /assistant/conversations:
    get:
      operationId: assistantConversations
      security: [{sessionCookie: []}]
      description: Private member/team history with keyset pagination, content/title search and active/archive/trash states. Never exposes teammates' conversations.
      parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 300}}
      - {name: state, in: query, schema: {type: string, enum: [active, archived, deleted], default: active}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 30}}
      responses:
        '200': {description: 'items and next_cursor. Metadata includes revision, archive/delete timestamps and original model configuration snapshot; keys are never returned.'}
        '403': {$ref: '#/components/responses/Error'}
  /assistant/conversations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: assistantConversation
      security: [{sessionCookie: []}]
      description: Private conversation detail. Action drafts, edits and execution states are refreshed from their authoritative records, including decided_at and current result availability (available). Deleted or inaccessible source objects keep execution evidence but lose navigation.
      responses:
        '200': {description: 'Conversation metadata and turns, each containing request_id, user, reply, actions and server-generated object links.'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: changeAssistantConversation
      security: [{sessionCookie: []}]
      description: Revision-checked rename/archive/unarchive/soft-delete/restore. Archived or deleted history cannot send turns, edit drafts or confirm writes. Restoring never executes old drafts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expected_revision]
              properties:
                action: {type: string, enum: [rename, archive, unarchive, delete, restore]}
                title: {type: string, maxLength: 180}
                expected_revision: {type: integer}
      responses:
        '200': {description: Updated.}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/templates:
    get:
      operationId: assistantTemplates
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Three built-in templates and accessible latest personal/team template versions.}
    post:
      operationId: saveAssistantTemplate
      security: [{sessionCookie: []}]
      description: Create or append an immutable template version. Existing ID requires revision. Personal owner or team administrator only. Templates only restrict Go tools; they cannot grant permissions or execute scripts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantTemplate'}
      responses:
        '200': {description: Saved template including new version/revision.}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/jobs:
    get:
      operationId: assistantJobs
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Private scheduled tasks with next_run_at; these are plans, not published progress.}
    post:
      operationId: saveAssistantJob
      security: [{sessionCookie: []}]
      description: Explicitly save/authorize or pause/resume a private job. Source configuration revision and template content/version are pinned. Every run rechecks membership and source. Default read-only/drafts; publish separately authorizes reports only. No Todo or schedule writes by background jobs. Missed intervals coalesce, DST skipped times skip the day and repeated times run once. Three attempts with bounded leases/backoff. No automatic provider fallback. Unchanged source data is silent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantJob'}
      responses:
        '200': {description: Saved job with revision and next execution instant.}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/jobs/preview:
    get:
      operationId: previewAssistantJob
      security: [{sessionCookie: []}]
      description: Compute next_run_at with the worker's IANA/DST policy without saving or authorizing a job.
      parameters:
      - {name: timezone, in: query, required: true, schema: {type: string}}
      - {name: local_time, in: query, required: true, schema: {type: string}}
      - {name: weekdays, in: query, required: true, schema: {type: string}, description: 'Comma-separated weekday numbers, Sunday 0.'}
      responses:
        '200': {description: Next execution instant.}
        '400': {$ref: '#/components/responses/Error'}
  /assistant/jobs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: pauseAssistantJob
      security: [{sessionCookie: []}]
      description: Revoke this owned job grant immediately, even if its provider configuration has been deleted or encryption is unavailable. Resume requires full reauthorization through POST /assistant/jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                expected_revision: {type: integer}
      responses:
        '200': {description: Paused job with new revision.}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/jobs/{id}/runs:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: assistantJobRuns
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Latest 50 owned runs with scheduled_at, state, attempts, conversation_id, report_id, safe message and finished_at. States queued/running/retry/done/draft/unchanged/blocked/failed.}
  /assistant/mcp:
    get:
      operationId: assistantMCPConnections
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Accessible personal/team connections and reviewed tool manifests. Never returns credentials.}
    post:
      operationId: saveAssistantMCPConnection
      security: [{sessionCookie: []}]
      description: Owner or team admin saves a public HTTPS Streamable HTTP endpoint. Optional service-issued Bearer token is encrypted separately from model credentials. ID/revision updates preserve an omitted/empty token, invalidate verification and clear tool approvals. No stdio process, OAuth flow, arbitrary redirects or external write tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, url]
              properties:
                id: {type: string}
                revision: {type: integer}
                name: {type: string, maxLength: 120}
                scope: {type: string, enum: [personal, team]}
                url: {type: string, format: uri}
                token: {type: string, writeOnly: true, maxLength: 6000}
      responses:
        '200': {description: Saved connection without token.}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/mcp/{id}/verify:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: verifyAssistantMCPConnection
      security: [{sessionCookie: []}]
      description: Initialize/initialized handshake, negotiate 2025-11-25, 2025-06-18 or 2025-03-26, list up to 100 tools, JSON/SSE replies, bounded session cleanup. Only explicitly read-only non-destructive tools are eligible. A changed manifest clears approval. External descriptions/results are untrusted data.
      responses:
        '200': {description: Verified tools, new revision and existing compatible approvals.}
        '400': {$ref: '#/components/responses/Error'}
  /assistant/mcp/{id}/approve:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: approveAssistantMCPTools
      security: [{sessionCookie: []}]
      description: Explicitly approve a subset of the verified read-only tool manifest. Empty selection revokes access. Before each call Go rechecks connection revision, actual server manifest and supported JSON Schema constraints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, tools]
              properties:
                expected_revision: {type: integer}
                tools: {type: array, items: {type: string}}
      responses:
        '200': {description: Approved connection with new revision.}
        '409': {$ref: '#/components/responses/Error'}
  /assistant/chat:
    post:
      operationId: assistantChat
      security: [{sessionCookie: []}]
      description: Returns JSON by default, or SSE with Accept text/event-stream. Events start/delta/done/error; deltas are temporary, only done confirms the saved result. Provider supports Chat Completions and Responses text SSE; hidden reasoning is never emitted, split credentials are redacted, incomplete upstream streams are rejected. No automatic billable retry. Verified accessible configuration required. History is server-owned and team/member isolated. New conversations derive a stable ID from request_id for uncertain-response recovery. Repeating request_id/message/web_enabled/web_config_id returns the saved turn; switching providers requires a new conversation. Read tools reuse current-team business services; write tools prepare drafts only, including task move/complete/reopen/reassign/comment via propose_task_change. read_handoff and read_changes resume scoped facts and original source links; read_workspace returns board_revision. No task write tool is available to background jobs. No business changes execute here. Maximum 20 turns, 12 tool calls, 8 proposals, 5 provider round trips and 24-second total timeout. Chat/verification limited to 10 requests per member/team/minute. Shared Go concurrency limited to 3. No platform credit or automatic provider fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_id, request_id, message]
              properties:
                config_id: {type: string}
                conversation_id: {type: string}
                template_id: {type: string}
                template_version: {type: integer}
                parameters: {type: object, additionalProperties: {type: string}, description: Validated template parameters, pinned with the first turn.}
                mcp_ids: {type: array, maxItems: 3, items: {type: string}, description: Explicitly selected verified connections with approved read-only tools.}
                web_enabled: {type: boolean, default: false, description: Explicit per-turn opt-in to the independent web_config_id; works across model providers. Rejected for background jobs. Three external requests maximum, no automatic retry or vendor fallback; identical successful calls cached within the turn. Fetch accepts only public HTTPS URLs returned by search or explicitly supplied this turn. Model keys are never used for browsing.}
                web_config_id: {type: string, description: Required when web_enabled is true. An accessible verified personal/account or current-team web configuration; ignored when web is disabled.}
                request_id: {type: string, maxLength: 120}
                message: {type: string, maxLength: 6000, description: Server also enforces a 6000-byte limit.}
                locale: {type: string, enum: [en, zh-CN]}
                context:
                  type: object
                  description: Untrusted page/filter hints, never authorization or confirmed object existence; at most 1800 bytes encoded.
                  properties:
                    page: {type: string}
                    project: {type: string}
                    domain: {type: string}
                    member: {type: string}
                    todo: {type: string}
                    report: {type: string}
                    date: {type: string}
                    timezone: {type: string}
      responses:
        '200': {description: 'conversation_id and turn with reply, links, pending action cards, tool activity and provider-reported usage (unknown if unavailable, never invented costs). No model-generated URL is trusted as a navigable object link. Optional web_enabled, web_config_id, web_provider, web_config_revision, web_requests and web_sources record actual selected-vendor attempts and sanitized external sources separately from internal links; external content never executes business writes.'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /assistant/actions/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: editAssistantDraft
      security: [{sessionCookie: []}]
      description: Edit only an owned pending report draft's title/body, as a durable step before confirmation. Does not execute or alter original task links/project. Completed/cancelled/failed drafts cannot be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: {type: string}
                body: {type: string}
      responses:
        '200': {description: Updated pending action metadata and payload.}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      operationId: confirmAssistantAction
      security: [{sessionCookie: []}]
      description: Explicitly confirm or cancel an owned action. Go reuses original Todo/Timeline services for object permissions, validation, revisions, history and stable action-derived idempotency. Task changes use the original task/board revisions; reassign resolves verified members, comments do not add implicit mentions. Schedule updates preserve deadline and completion; report status is progress. Repeat confirmations return durable results; cancelled actions never execute. Batch cards are independent actions, not one transaction. An execution validation/conflict failure is returned as state=failed with a safe result.error, not as success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [confirm, cancel]}
      responses:
        '200': {description: 'Action id, kind, title, payload, state (pending/done/failed/cancelled) and result. Only state=done proves execution.'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /calendar/reports:
    get:
      operationId: calendarReports
      description: Requires reports:read only. Bounded read-only projection of original reports by created_at in the display time zone. No duplicated reports. Deleted reports are excluded. Counts, previews and page share a repeatable-read snapshot. All filters apply to report metadata; member means author. One report counts once even with multiple domains/tasks. HTTP responses are private no-store.
      parameters:
      - {$ref: '#/components/parameters/CalendarFrom'}
      - {$ref: '#/components/parameters/CalendarTo'}
      - {$ref: '#/components/parameters/CalendarTimezone'}
      - {$ref: '#/components/parameters/CalendarCursor'}
      - {$ref: '#/components/parameters/CalendarRevision'}
      - {$ref: '#/components/parameters/CalendarLimit'}
      - {name: day, in: query, schema: {type: string, format: date}, description: Optional selected day inside the range. Restricts items/total but leaves range counts/previews intact.}
      - {name: project, in: query, schema: {type: string}}
      - {name: domain, in: query, schema: {type: string}}
      - {name: member, in: query, schema: {type: string}, description: Author member ID.}
      - {name: agent, in: query, schema: {type: string}}
      - {name: model, in: query, schema: {type: string}}
      - {name: status, in: query, schema: {type: string, enum: [progress, review, blocked, delivered, resolved]}}
      - {name: q, in: query, schema: {type: string, maxLength: 500}, description: Case-insensitive title/body substring.}
      responses:
        '200':
          description: Daily counts, up to three title previews per day, and a page of original report summaries. Read full body/comments/linked tasks from the original report with their own permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Report'}}
                  days: {type: object, additionalProperties: {type: integer}}
                  previews: {type: object, additionalProperties: {type: array, maxItems: 3, items: {type: object, properties: {id: {type: string}, title: {type: string}}}}}
                  total: {type: integer}
                  revision: {type: string}
                  next_cursor: {type: string}
                  timezone: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calendar/schedule:
    get:
      operationId: calendarSchedule
      description: Requires todos:read or calendar:read. Combines only readable sources in a bounded date range. A task appears when its schedule overlaps OR its independent due_date is in range; it is returned once with both fields. Member means assignee. Counts and pagination use a common team-locked read and revision. Missing source scopes are reported in capabilities, never disguised as empty authorized sources.
      parameters:
      - {$ref: '#/components/parameters/CalendarFrom'}
      - {$ref: '#/components/parameters/CalendarTo'}
      - {$ref: '#/components/parameters/CalendarTimezone'}
      - {$ref: '#/components/parameters/CalendarCursor'}
      - {$ref: '#/components/parameters/CalendarRevision'}
      - {$ref: '#/components/parameters/CalendarLimit'}
      - {name: project, in: query, schema: {type: string}}
      - {name: domain, in: query, schema: {type: string}}
      - {name: member, in: query, schema: {type: string}}
      - {name: kind, in: query, schema: {type: string, enum: [todo, phase, big_day, version]}}
      - {name: task_status, in: query, schema: {type: string, enum: [open, completed]}, description: Filters only tasks; independent planning nodes have no task completion state.}
      - {name: archived, in: query, schema: {type: boolean, default: false}, description: Include archived sources instead of active ones. Source details retain their original restore actions.}
      - {name: q, in: query, schema: {type: string, maxLength: 500}, description: Title substring.}
      - {name: unscheduled, in: query, schema: {type: boolean}, description: Requires todos:read. Lists tasks with neither schedule nor due_date; the date range still bounds the query contract but does not exclude these undated tasks.}
      responses:
        '200':
          description: Stable source references, planning summaries and readable-source capabilities. No report bodies or independent task copies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CalendarItem'}}
                  capabilities: {type: object, properties: {todos: {type: boolean}, events: {type: boolean}, reports: {type: boolean}}}
                  total: {type: integer}
                  revision: {type: string}
                  next_cursor: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calendar/events:
    post:
      operationId: createCalendarEvent
      description: Requires calendar:read/write. Creates an independent phase, Big Day or version milestone, deduplicated by team/creator/source_id. Identical operation_id retries replay; changed payload returns 409. Explicit todo_ids/report_ids require corresponding read scopes and same-team accessible objects. Planning never dispatches work, creates reports or releases software.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarEventInput'}
      responses:
        '200':
          description: Created event or existing event with matching source_id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /calendar/events/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getCalendarEvent
      description: Requires calendar:read. Includes archived objects and audit history. References and history are filtered by source read permissions; deleted reports are omitted. A link grants no access to its source.
      responses:
        '200':
          description: Original independent planning event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarEvent'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCalendarEvent
      description: Requires calendar:read/write and creator/assignee permission; browser admins may manage team events. Partial edit or archive/restore, with expected_revision and operation_id. Absent references remain unchanged. Read fresh state after 409; never overwrite another actor's schedule automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarEventInput'}
      responses:
        '200':
          description: Updated event with new revision and history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalendarEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health and local-demo mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mode:
                    type: string
      security: []
  /agent/changes:
    get:
      operationId: agentChanges
      description: >-
        Team mode only. Requires at least one module read scope. /meta advertises changes-v1.
        No cursor returns an empty baseline and next_cursor; no historical backfill before migration 014.
        Subsequent calls return ascending compact invalidations for readable modules only, not copied bodies.
        Duplicate object invalidations are valid. Re-read original objects using current permissions.
        Deleted/unavailable objects may only return an ID here; never restore content from a private snapshot.
        Cursor binds member, team, project and module read permissions; a changed binding requires a new baseline.
        Project moves match both old and new projects. Feed reads and writes share the team transaction lock,
        so the cursor never advances beyond an uncommitted event. Does not mark human notifications read.
      parameters:
      - {name: project, in: query, schema: {type: string}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Save next_cursor only after processing this page; drain has_more before waiting. No automatic polling or execution authorization is created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseline: {type: boolean}
                  coverage: {type: string}
                  next_cursor: {type: string}
                  has_more: {type: boolean}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [todo, report, calendar]}
                        object_id: {type: string}
                        created_at: {type: string, format: date-time}
                        url: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent/context:
    get:
      operationId: agentHandoff
      description: >-
        Team mode only. /meta advertises context-v1. Requires project or todo, and at least one source read scope.
        A specific todo requires todos:read. Returns current team/member, observed_at, columns and bounded facts:
        up to 10 active project tasks (or the focused task including archived), 5 recent relevant reports,
        10 open untransferred collaborations and 10 independent calendar nodes. Task/report discussions include
        at most 3 recent comments; bodies are excerpts of at most 600 bytes plus ellipsis, links/history omitted.
        Sections carry total/truncated/source and discussion_truncated as appropriate. content_excerpted is true; sources contain original readable object links.
        omitted_scopes distinguishes unavailable modules from empty results; unreadable cross-module references
        are removed. Re-read originals and paginate module APIs when needed. This is a multi-read factual snapshot,
        not an atomic export, persistent knowledge base, inferred acceptance or ongoing execution grant.
      parameters:
      - {name: project, in: query, schema: {type: string}}
      - {name: todo, in: query, schema: {type: string}}
      responses:
        '200': {description: Permission-filtered facts with original IDs, source API paths and explicit truncation.}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /meta:
    get:
      operationId: getMetadata
      responses:
        '200':
          description: Current authenticated member and team, members, projects, domains, role, mode and timezone. Requires reports:read, todos:read or calendar:read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_capabilities:
                    type: array
                    items: {type: string, enum: [changes-v1, context-v1, todo-review-v1]}
                    description: Optional capability discovery. Older deployments omit it; local demo only advertises todo-review-v1. Never infer write scopes or a real backend from this list.
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  domains:
                    type: array
                    items:
                      type: string
                  current_user:
                    type: string
                  mode:
                    type: string
                  timezone:
                    type: string
                  role:
                    type: string
                    enum:
                    - admin
                    - member
                  team:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  catalog:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                    description: Team mode category lifecycle and aliases. Includes merged rows for resolution history.
        '401':
          $ref: '#/components/responses/Error'
  /reports:
    get:
      operationId: listReports
      parameters:
      - name: project
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: member
        in: query
        schema:
          type: string
      - name: agent
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Reports ordered by creation time descending, including comments.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertReport
      description: Requires reports:write. Upserts for the current member/team; creation time and comments are preserved.
        Author/team fields in input cannot override identity. A deleted source_id returns 409 and cannot be recreated by upsert; restore requires an authorized web session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '200':
          description: Saved report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /reports/{id}:
    get:
      operationId: getReport
      description: Read an active report with visible comments in the authenticated current team. Used for locating shared reports; grants no additional access.
      security:
      - agentBearer: []
      - sessionCookie: []
      responses:
        '200':
          description: Active report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteReport
      description: Session-only author or team administrator soft-deletes a report. Requires latest updated_at; stale requests return 409. Repeated deletion is idempotent. Preserves content/history and hides report, discussion, collaboration and notifications from normal reads. Agent tokens are rejected.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_updated_at]
              properties:
                expected_updated_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Moved to trash
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      operationId: editReportContent
      description: Browser author or team administrator edits report content. Preserves source_id, author, Agent, Model and creation time. Requires expected_updated_at from the latest report; stale edits return 409. Changed classification is manually confirmed. Comments and history remain attached.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReportInput'
              - type: object
                required: [expected_updated_at, status, links, mentions, domains]
                properties:
                  expected_updated_at:
                    type: string
                    format: date-time
      responses:
        '200':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
