      security: []
      responses:
        '201': *id002
        '503': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name: &id003
                  type: string
                password: &id004
                  type: string
                  writeOnly: true
                  minLength: 8
                  maxLength: 72
                team_name: *id003
              required:
              - email
              - name
              - password
              - team_name
  /auth/login:
    post:
      operationId: login
      description: Verifies password and sets session cookie. No public account signup; new users require an invitation.
      security: []
      responses:
        '200': *id002
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '410': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
