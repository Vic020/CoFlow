openapi: 3.1.0
info:
  title: CoFlow Local Development API
  version: 0.1.0
  description: >-
    Local demo only. Every write belongs to demo member chen in team demo;
    supplied author_id/team_id are ignored. No production authentication yet.
    source_id is the upsert key scoped to team and authenticated member.
servers:
  - url: http://127.0.0.1:8080/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health and local-demo mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  mode: { type: string }
  /meta:
    get:
      operationId: getMetadata
      responses:
        "200":
          description: Demo members, projects, domains, current_user, mode and timezone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  domains: { type: array, items: { type: string } }
                  current_user: { type: string }
                  mode: { type: string }
                  timezone: { type: string }
  /reports:
    get:
      operationId: listReports
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: member, in: query, schema: { type: string } }
        - { name: agent, in: query, schema: { type: string } }
      responses:
        "200":
          description: Reports ordered by creation time descending, including comments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Report" },
                    }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: upsertReport
      description: >-
        Creates a report or replaces the content of an existing report with the same
        source_id for the current member. Existing ID, creation time and comments
        are preserved. Omit source_id only for a new non-retryable report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "200":
          description: Saved report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateReportStatus
      description: Only the current report author may update status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: Updated report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /reports/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  {
                    type: string,
                    minLength: 1,
                    description: Markdown; maximum 12000 UTF-8 bytes.,
                  }
      responses:
        "201":
          description: Saved comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: A validation, ownership or storage error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    Status:
      type: string
      enum: [progress, review, blocked, delivered, resolved]
    Link:
      type: object
      required: [url]
      properties:
        title: { type: string }
        url: { type: string, format: uri, pattern: "^https?://" }
    Member:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        color: { type: string }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domains: { type: array, items: { type: string } }
        status: { type: string }
    ReportInput:
      type: object
      required: [title]
      properties:
        source_id:
          {
            type: string,
            description: Stable key for retries; maximum 200 UTF-8 bytes.,
          }
        title:
          { type: string, minLength: 1, description: Maximum 600 UTF-8 bytes. }
        body:
          { type: string, description: Markdown; maximum 60000 UTF-8 bytes. }
        project_id:
          {
            type: string,
            description: Existing project ID; empty means unassigned.,
          }
        domain:
          {
            type: string,
            description: Existing domain; empty means unclassified.,
          }
        agent:
          {
            type: string,
            description: Descriptive tool name; maximum 100 UTF-8 bytes.,
          }
        model:
          {
            type: string,
            description: Optional model name; maximum 100 UTF-8 bytes.,
          }
        status: { $ref: "#/components/schemas/Status" }
        links:
          {
            type: array,
            maxItems: 20,
            items: { $ref: "#/components/schemas/Link" },
          }
        mentions:
          {
            type: array,
            items: { type: string },
            description: Existing member IDs.,
          }
    Report:
      allOf:
        - { $ref: "#/components/schemas/ReportInput" }
        - type: object
          properties:
            id: { type: string }
            team_id: { type: string, readOnly: true }
            author_id: { type: string, readOnly: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            comments:
              { type: array, items: { $ref: "#/components/schemas/Comment" } }
    Comment:
      type: object
      properties:
        id: { type: string }
        report_id: { type: string }
        author_id: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
