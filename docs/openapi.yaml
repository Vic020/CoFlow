      - in: header
        name: X-CoFlow-Setup-Token
        required: true
        schema:
          type: string
          minLength: 32
          writeOnly: true
      description: One-time workspace/admin creation, serialized in a database transaction; sets a browser session
        cookie. Requires the server-configured COFLOW_BOOTSTRAP_TOKEN (at least 32 characters). Missing
        or weak server configuration blocks setup with 503. Incorrect or absent header returns 403.
