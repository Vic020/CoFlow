        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
  /reports/{id}/read:
    post:
      operationId: markReportRead
      description: Browser only. Supply the timestamp actually displayed; concurrent later updates remain unread.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seen_at:
                  type: string
                  format: date-time
              required:
              - seen_at
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /teams:
    post:
      operationId: createTeam
      description: Browser only. Create a team with current member as admin and switch this session to it. Existing
        Agent Tokens keep their original team.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id007
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id007
                display_name:
                  type: string
                  description: Optional team-specific name for the creating member. Defaults to the account name.
              required:
              - name
  /reports/trash:
    get:
      operationId: listDeletedReports
      description: Session-only. Lists deleted reports authored by the current member, or all in the current team for its administrator. Does not grant access to other teams.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Deleted reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
        '403':
          $ref: '#/components/responses/Error'
  /reports/{id}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      operationId: restoreReport
      description: Session-only author or team administrator restores the original report and its existing associations. Separately deleted comments stay deleted. Idempotent; no new source_id or duplicate report.
      security:
      - sessionCookie: []
      responses:
        '200': {description: "Restored"}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/trash:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: listDeletedComments
      description: Session-only. Lists own deleted comments on an active current-team report, or all its deleted comments for a team administrator.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Deleted comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '403': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/{comment}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    - name: comment
      in: path
      required: true
      schema: {type: string}
    delete:
      operationId: deleteComment
      description: Session-only comment author or team administrator soft-deletes a comment on an active report. Idempotent; records the actor and comment ID without exposing deleted text in history.
      security:
      - sessionCookie: []
      responses:
        '200': {description: "Moved to trash"}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /reports/{id}/comments/{comment}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    - name: comment
      in: path
      required: true
      schema: {type: string}
    post:
      operationId: restoreComment
      description: Session-only comment author or team administrator restores a comment on an active report. Idempotent; deleted parent reports must be restored separately.
      security:
      - sessionCookie: []
      responses:
        '200': {description: "Restored"}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /todo-completions:
    get:
      operationId: listTodoCompletionEvents
      description: Requires todos:read. Task completion events for daily summaries; includes event-time classification and assignee. Count distinct task IDs per local calendar day, separately from report deliveries.
      responses:
        '200':
          description: Completion events, including archived task history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        todo_id: {type: string}
                        completed_at: {type: string, format: date-time}
                        assignee_id: {type: string}
                        project_id: {type: string}
                        domains: {type: array, items: {type: string}}
                        creator_id: {type: string}
                        agent: {type: string}
  /todo-board:
    get:
      operationId: getTodoBoard
      description: Requires todos:read. Team board, stable column IDs, default completed column and ordering revision. First read initializes defaults idempotently.
      responses:
        '200':
          description: Board metadata; tasks and idempotency records are not exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoBoard'
  /todos:
    get:
      operationId: listTodos
      description: Requires todos:read. Team-isolated filtered tasks ordered by column, position and ID. Use a column filter for per-column pagination; only visible anchors may be used to move a task.
      parameters:
      - {name: q, in: query, schema: {type: string}}
      - {name: project, in: query, schema: {type: string}}
      - {name: domain, in: query, schema: {type: string}}
      - {name: assignee, in: query, schema: {type: string}}
      - {name: column, in: query, schema: {type: string}}
      - {name: scope, in: query, schema: {type: string, enum: [all, related, todo]}}
      - {name: archived, in: query, schema: {type: boolean, default: false}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Filtered page, total and next_cursor. Related includes a configured reviewer; scope=todo includes pending reviews assigned to the current member as well as their unfinished tasks. Missing cursor after concurrent movement returns 409; reload the board.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Todo'}}
                  total: {type: integer}
                  next_cursor: {type: string}
    post:
      operationId: createTodo
      description: Requires todos:read/write. Deduplicated by team/member/source_id; identical operation_id retries replay the result. A different payload with the same operation_id returns 409. Optional report_ids require reports:read and accessible reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TodoInput'
              - {required: [title, column_id, source_id, operation_id]}
      responses:
        '200':
          description: Created task or replay of the existing task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '409': {description: "Operation ID reused with a different payload."}
  /todos/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getTodo
      description: Requires todos:read. Includes comments, event history and report IDs only when readable; report bodies require reports:read.
      responses:
        '200':
          description: Task details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '404': {description: "Task absent from current team."}
    patch:
      operationId: changeTodo
      description: Requires todos:read/write and creator or assignee permission; browser admins may maintain all team tasks. Comment requires todos:read plus comments:write. Delete/restore comment is browser-only and author/admin only. Every write requires expected_revision and operation_id. Edit is partial; moves also require board_revision and at most one destination before_id/after_id anchor. Moving never authorizes execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TodoInput'
              - {required: [operation_id, expected_revision]}
      responses:
        '200':
          description: Updated task, or original result for identical retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '403': {description: "Missing scope or object permission."}
        '409': {description: "Stale revision or reused operation ID; reread and reconcile before a new operation."}
  /todo-columns:
    post:
      operationId: createTodoColumn
      description: Browser team admin only. Requires name, operation_id and current board_revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoColumnInput'}
      responses:
        '200':
          description: Updated board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoBoard'}
  /todo-columns/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: changeTodoColumn
      description: Browser team admin only. Atomic completion changes or archive-and-migrate, including archived tasks. At least one active incomplete and completed column remain. Change default before archiving or unmarking it. Order supplies every column ID exactly once; default selects an active completed column.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoColumnInput'}
      responses:
        '200':
          description: Updated board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoBoard'}
        '409': {description: "Stale column or board revision."}
  /collaborations/{id}/todo:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: transferCollaborationToTodo
      description: Requires reports:read, todos:read/write and collaboration creator/assignee permission (browser admins may manage all). Creates at most one takeover task; repeats return it. Original discussion stays attached to the report, todo_id marks takeover and independent collaboration status updates cease. Team mode only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column_id]
              properties:
                column_id: {type: string}
      responses:
        '200':
          description: Task taking over this collaboration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
components:
  parameters:
    CalendarFrom: {name: from, in: query, required: true, schema: {type: string, format: date}, description: Inclusive civil date in timezone.}
    CalendarTo: {name: to, in: query, required: true, schema: {type: string, format: date}, description: Exclusive civil date. Range must be 1–93 civil days including DST transitions.}
    CalendarTimezone: {name: timezone, in: query, schema: {type: string, default: UTC}, description: Valid IANA time zone. All-day dates never shift with it.}
    CalendarCursor: {name: cursor, in: query, schema: {type: string, maxLength: 1000}, description: Opaque next_cursor from the prior page; requires revision and unchanged filters.}
    CalendarRevision: {name: revision, in: query, schema: {type: string, maxLength: 160}, description: Prior response revision. A changed source or query returns 409.}
    CalendarLimit: {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 200}}
  responses:
    Error:
      description: A validation, ownership or storage error.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
  schemas:
    AssistantTemplate:
      type: object
      required: [scope, title, instructions, tools]
      properties:
        id: {type: string}
        scope: {type: string, enum: [builtin, personal, team]}
        title: {type: string, maxLength: 180}
        description: {type: string, maxLength: 500}
        instructions: {type: string, maxLength: 12000}
        parameters:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}
              label: {type: string}
              required: {type: boolean}
        tools: {type: array, items: {type: string}}
        version: {type: integer}
        revision: {type: integer}
        editable: {type: boolean, readOnly: true}
    AssistantJob:
      type: object
      required: [title, config_id, template, prompt, locale, timezone, local_time, weekdays]
      properties:
        id: {type: string}
        title: {type: string, maxLength: 180}
        config_id: {type: string}
        config_revision: {type: integer, readOnly: true}
        template: {$ref: '#/components/schemas/AssistantTemplate'}
        context: {type: object, description: Frozen page/project/domain/member scope hints; validated by module services.}
        parameters: {type: object, additionalProperties: {type: string}}
        prompt: {type: string, maxLength: 6000}
        locale: {type: string, enum: [en, zh-CN]}
        timezone: {type: string, description: IANA timezone.}
        local_time: {type: string, pattern: '^\d{2}:\d{2}$'}
        weekdays: {type: array, minItems: 1, maxItems: 7, items: {type: integer, minimum: 0, maximum: 6}, description: Sunday is 0.}
        publish: {type: boolean, default: false}
        enabled: {type: boolean, default: false}
        revision: {type: integer}
        next_run_at: {type: string, format: date-time, readOnly: true}
        last_run_state: {type: string, readOnly: true}

    WebConfig:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [personal, team]}
        provider: {type: string, enum: [tavily, deepseek, exa, firecrawl]}
        revision: {type: integer}
        is_default: {type: boolean}
        verified_at: {type: [string, 'null'], format: date-time}
        editable: {type: boolean}
    WebConfigWrite:
      type: object
      required: [name, scope, provider]
      properties:
        id: {type: string, description: Existing editable config ID for draft verification.}
        name: {type: string, maxLength: 100}
        scope: {type: string, enum: [personal, team]}
        provider: {type: string, enum: [tavily, deepseek, exa, firecrawl]}
        api_key: {type: string, writeOnly: true, maxLength: 4096, description: Required for a new config or changed provider. Empty on edit reuses only an editable same-provider key.}
        expected_revision: {type: integer, minimum: 1}
        is_default: {type: boolean}
        verification_token: {type: string, writeOnly: true, description: Matching transient proof; required for new or changed connections.}
    AIConfig:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [team, personal]}
        provider: {type: string, enum: [deepseek, glm, openai, compatible]}
        protocol: {type: string, enum: [chat-completions, responses]}
        base_url: {type: string, format: uri}
        model: {type: string}
        revision: {type: integer}
        is_default: {type: boolean}
        verified_at: {type: [string, 'null'], format: date-time}
        editable: {type: boolean}
    AIConfigWrite:
      type: object
      required: [name, scope, provider, protocol, base_url, model]
      properties:
        name: {type: string, maxLength: 100}
        scope: {type: string, enum: [team, personal]}
        provider: {type: string, enum: [deepseek, glm, openai, compatible]}
        protocol: {type: string, enum: [chat-completions, responses]}
        base_url: {type: string, format: uri}
        model: {type: string, maxLength: 150}
        api_key: {type: string, writeOnly: true, maxLength: 4096, description: Required on creation. Empty on edit preserves the encrypted key only if provider and canonical Base URL stay unchanged.}
        verification_token: {type: string, writeOnly: true, description: Optional signed pre-save verification proof. Changed or expired proof fails saving.}
        is_default: {type: boolean}
        expected_revision: {type: integer, description: Required on update.}
    Schedule:
      description: Null clears an optional Todo plan. Date ranges include both civil dates and never carry a timezone; time ranges normalize RFC3339 offsets to UTC and retain an IANA planning timezone. Time ranges require end greater than start; independent Big Day/version points require equal ends. Missing endpoints are invalid. due_date is independent and is never shifted by planning.
      oneOf:
      - type: object
        required: [kind, start_date, end_date]
        properties:
          kind: {type: string, const: date-range}
          start_date: {type: string, format: date}
          end_date: {type: string, format: date}
        additionalProperties: false
      - type: object
        required: [kind, start_at, end_at, timezone]
        properties:
          kind: {type: string, const: time-range}
          start_at: {type: string, format: date-time}
          end_at: {type: string, format: date-time}
          timezone: {type: string}
        additionalProperties: false
    CalendarItem:
      type: object
      properties:
        blocked: {type: boolean, readOnly: true}
        id: {type: string}
        creator_id: {type: string, description: Original creator; source write permissions are still enforced by Go.}
        key: {type: string, description: Source-prefixed projection key; use id with the original source endpoint to mutate.}
        source: {type: string, enum: [todo, event]}
        kind: {type: string, enum: [todo, phase, big_day, version]}
        title: {type: string}
        project_id: {type: string}
        domains: {type: array, items: {type: string}}
        member_id: {type: string}
        schedule: {oneOf: [{$ref: '#/components/schemas/Schedule'}, {type: 'null'}]}
        due_date: {type: string}
        completed: {type: boolean}
        revision: {type: integer}
    CalendarEventInput:
      type: object
      required: [operation_id]
      properties:
        title: {type: string, description: Required on create; 1–500 UTF-8 bytes.}
        body: {type: string, maxLength: 50000}
        kind: {type: string, enum: [phase, big_day, version], description: Required on create. big_day/version require a single date or instant.}
        schedule: {$ref: '#/components/schemas/Schedule'}
        source_id: {type: string, maxLength: 160, description: Required on create; scoped to team/creator.}
        assignee_id: {type: string}
        project_id: {type: string}
        domains: {type: array, maxItems: 20, items: {type: string}}
        todo_ids: {type: array, maxItems: 20, items: {type: string}}
        report_ids: {type: array, maxItems: 20, items: {type: string}}
        links: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Link'}}
        agent: {type: string, maxLength: 160}
        model: {type: string, maxLength: 160}
        expected_revision: {type: integer, description: Required for changes to an existing event.}
        operation_id: {type: string, maxLength: 160}
        action: {type: string, enum: [edit, archive, restore]}
    CalendarEvent:
      allOf:
      - {$ref: '#/components/schemas/CalendarEventInput'}
      - type: object
        properties:
          review: {$ref: '#/components/schemas/TodoReview'}
          id: {type: string}
          creator_id: {type: string}
          revision: {type: integer}
          archived: {type: boolean}
          created_at: {type: string, format: date-time}
          updated_at: {type: string, format: date-time}
          history: {type: array, items: {type: object}, description: Actor, agent/model, action, timestamps and before/after snapshots with source-scoped references.}
    Status:
      type: string
      enum:
      - progress
      - review
      - blocked
      - delivered
      - resolved
    Link:
      type: object
      required:
      - url
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https?://
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        color:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        status:
          type: string
    ReportInput:
      type: object
      required:
      - title
      properties:
        todo_ids:
          type: array
          maxItems: 20
          items: {type: string}
          description: Requires todos:read. Stable task references; absent preserves links, [] clears them.
        operation_id:
          type: string
          description: Required for joint task movement; identical request retries replay atomically.
        todo_moves:
          type: array
          maxItems: 20
          description: Requires todos:read/write and task maintenance permission. Each task must be in todo_ids. Report, links, moves, history and notifications commit together or all roll back on 409.
          items:
            type: object
            required: [id, column_id, expected_revision]
            properties:
              id: {type: string}
              column_id: {type: string}
              expected_revision: {type: integer}
        source_id:
          type: string
          description: Stable key for retries; maximum 200 UTF-8 bytes.
        title:
          type: string
          minLength: 1
          description: Maximum 600 UTF-8 bytes.
        body:
          type: string
          description: Markdown; maximum 60000 UTF-8 bytes.
        project_id:
          type: string
          description: Existing project ID; empty means unassigned.
        domain:
          type: string
          description: Legacy single-domain name. Team mode accepts alongside domains; resolved and deduplicated.
            Demo still accepts only configured names.
        agent:
          type: string
          description: Descriptive tool name; maximum 100 UTF-8 bytes.
        model:
          type: string
          description: Optional model name; maximum 100 UTF-8 bytes.
        status:
          $ref: '#/components/schemas/Status'
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Link'
        mentions:
          type: array
          items:
            type: string
          description: Existing member IDs.
        project_name:
          type: string
          maxLength: 160
          description: 'Team mode: exact normalized name/alias matching; unknown names become pending proposals.
            Leave empty when uncertain. project_id takes precedence.'
        domains:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 160
          description: 'Team mode: multiple domain names/aliases. Unknown names become pending proposals; archived
            names rejected.'
    Report:
      allOf:
      - $ref: '#/components/schemas/ReportInput'
      - type: object
        properties:
          id:
            type: string
          team_id:
            type: string
            readOnly: true
          author_id:
            type: string
            readOnly: true
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          comments:
            type: array
            items:
              $ref: '#/components/schemas/Comment'
          deleted_at:
            type: string
            format: date-time
            readOnly: true
            description: Present only in session-authorized trash results.
          classification_input:
            type: object
            description: Original classification supplied by the Agent. Preserved by human correction and merges.
          classification_locked:
            type: boolean
            readOnly: true
            description: Human-corrected classification is retained on later Agent upserts.
    Comment:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          description: Present only in session-authorized trash results.
        id:
          type: string
        report_id:
          type: string
        author_id:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id: *id007
        kind:
          enum:
          - project
          - domain
        name: *id007
        aliases: *id009
        state:
          enum:
          - active
          - pending
          - archived
          - merged
        merged_into: *id007
    CollaborationUpdate:
      type: object
      properties:
        id: *id007
        actor_id: *id007
        status: *id007
        body: *id007
        created_at:
          type: string
          format: date-time
    Collaboration:
      type: object
      properties:
        id: *id007
        report_id: *id007
        author_id: *id007
        assignee_id: *id007
        title: *id007
        body: *id007
        status: *id010
        created_at: *id007
        updated_at: *id007
        updates:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationUpdate'
    Notification:
      type: object
      properties:
        id: *id007
        report_id: *id007
        request_id: *id007
        kind: *id007
        title: *id007
        created_at: *id007
        read_at:
          type:
          - string
          - 'null'
          format: date-time

    TodoBoard:
      type: object
      properties:
        revision: {type: integer}
        default_done_id: {type: string}
        history: {type: array, items: {type: object}, description: "Audited column and default/order changes."}
        columns: {type: array, items: {$ref: '#/components/schemas/TodoColumn'}}
    TodoColumn:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        done: {type: boolean}
        archived: {type: boolean}
        revision: {type: integer}
        task_count: {type: integer, description: "All tasks in the column including archived tasks."}
    TodoColumnInput:
      type: object
      required: [operation_id, board_revision]
      properties:
        name: {type: string, description: "1–160 UTF-8 bytes for create/edit."}
        done: {type: boolean}
        expected_revision: {type: integer, description: "Required for editing or archiving/restoring an existing column."}
        board_revision: {type: integer}
        operation_id: {type: string, maxLength: 160}
        action: {type: string, enum: [edit, archive, restore, order, default]}
        target_id: {type: string, description: "Destination for every task when archiving a nonempty column."}
        ids: {type: array, items: {type: string}, description: "Every column ID exactly once for order."}
    TodoReviewConfig:
      type: object
      required: [criteria, reviewer_id]
      properties:
        criteria: {type: string, minLength: 1, maxLength: 8000, description: 'Nonempty acceptance criteria; server enforces at most 8000 UTF-8 bytes.'}
        reviewer_id: {type: string, minLength: 1, maxLength: 160, description: Existing team member. No automatic reviewer selection.}
      description: Only these two configuration fields are accepted on create/edit. Supplied state, evidence or decision metadata is discarded. Null removes the requirement only while not pending/approved and not completed.
    TodoReview:
      allOf:
      - {$ref: '#/components/schemas/TodoReviewConfig'}
      - type: object
        properties:
          state: {type: string, readOnly: true, enum: [draft, pending, changes_requested, approved]}
          evidence: {type: string, readOnly: true}
          submitted_revision: {type: integer, readOnly: true, description: Task revision created by the submission action.}
          submitted_by: {type: string, readOnly: true}
          submitted_at: {type: string, format: date-time, readOnly: true}
          decision_by: {type: string, readOnly: true}
          decided_at: {type: string, format: date-time, readOnly: true}
          decision_note: {type: string, readOnly: true}
    KnowledgeGraphNode:
      type: object
      required:
      - key
      - id
      - kind
      - title
      - url
      - root
      properties:
        key:
          type: string
        id:
          type: string
        kind:
          type: string
          enum:
          - context
          - project
          - domain
          - todo
          - report
          - calendar
        title:
          type: string
        url:
          type: string
        state:
          type: string
        needs_review:
          type: boolean
        root:
          type: boolean
          description: True only for selected Context roots; related objects can lie outside
            root filters.
    KnowledgeGraphEdge:
      type: object
      required:
      - from
      - to
      - kind
      properties:
        from:
          type: string
        to:
          type: string
        kind:
          type: string
          enum:
          - project
          - domain
          - source
          - parent
          - todo_report
          - calendar_todo
          - calendar_report
    KnowledgeGraph:
      type: object
      properties:
        nodes:
          type: array
          maxItems: 600
          items:
            $ref: '#/components/schemas/KnowledgeGraphNode'
        edges:
          type: array
          maxItems: 2400
          items:
            $ref: '#/components/schemas/KnowledgeGraphEdge'
        total_contexts:
          type: integer
        shown_contexts:
          type: integer
          maximum: 120
        truncated:
          type: boolean
    ContextNode:
      type: object
      properties:
        reference_ids:
          type: array
          items: {type: string}
          description: Visible structured Context source IDs for backlinks, never source text.
        id:
          type: string
        title:
          type: string
        project_id:
          type: string
        kind:
          type: string
          enum:
          - background
          - decision
          - rule
          - conclusion
          - risk
          - date
          - document
          - index
        visibility:
          type: string
          enum:
          - team
          - personal
        state:
          type: string
          enum:
          - pending
          - active
          - expired
          - archived
        domains:
          type: array
          items:
            type: string
        revision:
          type: integer
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        parent_id:
          type: string
        creator_id:
          type: string
    ContextSource:
      type: object
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - todo
          - report
          - calendar
          - context
        needs_review:
          type: boolean
          readOnly: true
        id:
          type: string
        revision:
          type: string
        quote:
          type: string
          maxLength: 2000
        url:
          type: string
          readOnly: true
        changed:
          type: boolean
          readOnly: true
        archived:
          type: boolean
          readOnly: true
    ContextEntry:
      type: object
      properties:
        parent_id:
          type: string
          description: Optional compatible document/index parent. Same project and visibility; personal parent must have same creator. No cycles, maximum 12 levels.
        agent: {type: string, readOnly: true, description: Server-derived creation source; external token, platform assistant or manual browser. Never a guessed model identity.}
        id:
          type: string
        source_id:
          type: string
        creator_id:
          type: string
        title:
          type: string
        body:
          type: string
        project_id:
          type: string
        superseded_by:
          type: string
        kind:
          type: string
          enum:
          - background
          - decision
          - rule
          - conclusion
          - risk
          - date
          - document
          - index
        visibility:
          type: string
          enum:
          - team
          - personal
        state:
          type: string
          enum:
          - pending
          - active
          - expired
          - archived
        domains:
          type: array
          items:
            type: string
        sources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ContextSource'
        revision:
          type: integer
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
        history:
          type: array
          items:
            type: object
          description: Revision, actor, action, timestamp and snapshots when still authorized;
            unavailable hides body, title and sources.
        valid_from:
          type: string
          description: Empty or YYYY-MM-DD, inclusive UTC civil dates.
        valid_until:
          type: string
          description: Empty or YYYY-MM-DD, inclusive UTC civil dates.
        review_on:
          type: string
          description: Empty or YYYY-MM-DD, inclusive UTC civil dates.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ContextInput:
      allOf:
      - $ref: '#/components/schemas/ContextEntry'
      - type: object
        required:
        - operation_id
        properties:
          expected_revision:
            type: integer
          target_revision:
            type: integer
          operation_id:
            type: string
            maxLength: 160
          action:
            type: string
            enum:
            - edit
            - confirm
            - review
            - archive
            - restore
            - merge
      description: Create requires title/body/kind/visibility/state/source_id. Edit sends
        full editable record. Lifecycle actions require revision and operation identity;
        merge also requires superseded_by and target_revision.
    TodoBlocker:
      type: object
      properties:
        id:
          type: string
        todo_id:
          type: string
        waiting_member_id:
          type: string
        condition:
          type: string
          maxLength: 2000
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
    Delegation:
      type: object
      properties:
        id:
          type: string
        grantor_id:
          type: string
        member_id:
          type: string
        todo_id:
          type: string
        project_id:
          type: string
        actions:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum:
            - edit
            - move
            - comment
            - schedule
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        revision:
          type: integer
        history:
          type: array
          items:
            type: object
    DelegationInput:
      allOf:
      - $ref: '#/components/schemas/Delegation'
      - type: object
        required:
        - operation_id
        properties:
          operation_id:
            type: string
          expected_revision:
            type: integer
          action:
            type: string
            enum:
            - revoke
    TodoInput:
      type: object
      description: >-
        Every change requires operation_id and current expected_revision. Move/complete/reopen and approve-review
        additionally require board_revision. Review is optional: tasks without it keep existing completion behavior.
        Submit/withdraw require normal task maintenance permission. Approval/return require todos:write and the
        exact designated reviewer; administrator role does not replace that identity. Approval completes in the
        configured default done column; return keeps the task unfinished. Material edits invalidate pending review,
        approved content needs reopening before editing, and reopening resets approval but preserves history.
        Direct completion, joint report moves, drag moves and column completion cannot bypass a required review.
      properties:
        blockers: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/TodoBlocker'}}
        review: {oneOf: [{$ref: '#/components/schemas/TodoReviewConfig'}, {type: 'null'}], description: 'Optional acceptance requirement; absence preserves it on edit. Discover todo-review-v1 before using.'}
        title: {type: string, description: "Required on create; 1–500 UTF-8 bytes."}
        body: {type: string, description: "Task Markdown at most 50000 UTF-8 bytes; for submit-review it is required delivery evidence, for request-changes a required reason, and for approve-review an optional note (at most 12000 bytes)."}
        column_id: {type: string}
        assignee_id: {type: string, description: "Existing team member ID or empty for unassigned."}
        project_id: {type: string}
        domains: {type: array, maxItems: 20, items: {type: string}}
        priority: {type: string, enum: [none, low, medium, high], default: none}
        due_date: {type: string, description: "Empty or YYYY-MM-DD date without an implicit time zone."}
        schedule: {oneOf: [{$ref: '#/components/schemas/Schedule'}, {type: 'null'}], description: "Optional plan, independent of the deadline and workflow. Absent on edit preserves it; null clears it."}
        links: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Link'}}
        report_ids: {type: array, maxItems: 20, items: {type: string}, description: "Optional source reports on create; requires reports:read."}
        source_id: {type: string, maxLength: 160}
        agent: {type: string, maxLength: 160}
        model: {type: string, maxLength: 160}
        operation_id: {type: string, maxLength: 160}
        expected_revision: {type: integer}
        board_revision: {type: integer}
        action: {type: string, enum: [edit, move, complete, reopen, archive, restore, comment, delete-comment, restore-comment, submit-review, withdraw-review, approve-review, request-changes]}
        before_id: {type: string}
        after_id: {type: string}
        comment_id: {type: string}
        mentions: {type: array, maxItems: 50, items: {type: string}}
    Todo:
      allOf:
      - $ref: '#/components/schemas/TodoInput'
      - type: object
        properties:
          id: {type: string}
          creator_id: {type: string}
          previous_column_id: {type: string}
          collaboration_id: {type: string}
          blocked: {type: boolean, readOnly: true, description: Derived current prerequisite status; absence means false. All completion paths retain guards.}
          allowed_actions: {type: array, readOnly: true, items: {type: string}, description: Current edit/move/schedule authority; does not grant token scope or dispatch agents.}
          unavailable_reports: {type: integer, readOnly: true, description: Count of deleted source reports without exposing their content.}
          revision: {type: integer}
          archived: {type: boolean}
          position: {type: integer}
          completed_at: {type: [string, 'null'], format: date-time}
          created_at: {type: string, format: date-time}
          updated_at: {type: string, format: date-time}
          comments:
            type: array
            items:
              type: object
              properties:
                id: {type: string}
                author_id: {type: string}
                body: {type: string}
                mentions: {type: array, items: {type: string}}
                deleted: {type: boolean}
                created_at: {type: string, format: date-time}
          history:
            type: array
            items:
              type: object
              properties:
                id: {type: string}
                actor_kind: {type: string}
                actor_id: {type: string}
                agent: {type: string}
                model: {type: string}
                action: {type: string}
                before: {type: object}
                after: {type: object}
                created_at: {type: string, format: date-time}

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: coflow_session
      description: HttpOnly SameSite=Lax browser session, seven-day expiry.
    agentBearer:
      type: http
      scheme: bearer
      description: Personal Agent token, returned in full only at creation. Required scope depends on operation.
security:
- sessionCookie: []
- agentBearer: []
