name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run docs:check
      - run: npm run test:i18n
      - run: npm run test:agent
      - run: npm run test:demo
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coflow_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: coflow_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coflow_test -d coflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test -race -count=1 ./...
        working-directory: apps/api
        env:
          COFLOW_TEST_DATABASE_URL: postgres://coflow_test:ci_disposable_only@127.0.0.1:5432/coflow_ci?sslmode=disable
