name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run docs:check
      - run: npm run test:release
      - run: npm run test:images
      - run: npm run test:local-team
      - run: npm run test:i18n
      - run: npm run test:agent
      - run: npm run test:cache
      - run: npm run test:filters
      - run: npm run test:calendar
      - run: npm run test:assistant
      - run: npm run test:ai-operations
      - run: npm run test:knowledge
      - run: npm run test:todo-review
      - run: npm run test:demo
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  api:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coflow_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: coflow_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coflow_test -d coflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: python3 scripts/test-api-ci.py --shard ${{ matrix.shard }} --total 3
        env:
          COFLOW_TEST_DATABASE_URL: postgres://coflow_test:ci_disposable_only@127.0.0.1:5432/coflow_ci?sslmode=disable
