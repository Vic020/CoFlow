name: Build CLI release archives
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag with successful main CI
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cli-release-archives
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release source and successful CI
        id: release
        env:
          COFLOW_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-image-release.mjs
  package:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Build and check the release archive
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rust
          OUTPUT_DIR: ${{ runner.temp }}/cli-release
        run: bash scripts/package-cli.sh "$OUTPUT_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coflow-v${{ needs.verify.outputs.version }}-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/cli-release/coflow-v${{ needs.verify.outputs.version }}-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/cli-release/coflow-v${{ needs.verify.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
