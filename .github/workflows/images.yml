name: Build release images · GHCR
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag with successful main CI (e.g. v0.1.4)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      registry: ${{ steps.release.outputs.registry }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release source and successful CI
        id: release
        env:
          COFLOW_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-image-release.mjs
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check version records
        run: npm run version:check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.verify.outputs.registry }}-api:${{ needs.verify.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=coflow-api
          cache-to: type=gha,mode=max,scope=coflow-api
          provenance: mode=min
      - name: Build and publish Web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.verify.outputs.registry }}-web:${{ needs.verify.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=coflow-web
          cache-to: type=gha,mode=max,scope=coflow-web
          provenance: mode=min
      - name: Record exact image references
        env:
          IMAGE_BASE: ${{ needs.verify.outputs.registry }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            printf '## Release images %s\n\n' "$RELEASE_VERSION"
            printf 'Source: `%s`\n\n' "$SOURCE_SHA"
            printf 'API: `%s-api@%s`\n\n' "$IMAGE_BASE" "$API_DIGEST"
            printf 'Web: `%s-web@%s`\n\n' "$IMAGE_BASE" "$WEB_DIGEST"
            printf 'Build only. No server access, release creation, or deployment. Verify package visibility before anonymous pulls.\n'
          } >> "$GITHUB_STEP_SUMMARY"
