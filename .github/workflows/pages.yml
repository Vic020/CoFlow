name: Public demo · GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:demo
      - run: npm run build --workspace @coflow/web -- --webpack
        env:
          NEXT_PUBLIC_COFLOW_PUBLIC_DEMO: 'true'
          NEXT_PUBLIC_COFLOW_BASE_PATH: /CoFlow
          NEXT_TELEMETRY_DISABLED: '1'
      - run: touch apps/web/.next-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/.next-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@v4
