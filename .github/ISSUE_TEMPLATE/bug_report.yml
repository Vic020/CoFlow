name: Bug report
description: Help reproduce and fix a problem / 报告问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Use synthetic examples. Do not share credentials, cookies, active invitation links, account emails, or real team data. See SECURITY.md for security reports. 中文反馈也欢迎，请先脱敏。
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: 0.1.3 source, macOS, Chrome, team mode
    validations:
      required: true
  - type: input
    id: preferences
    attributes:
      label: Interface language and display time zone
      placeholder: English, Asia/Shanghai (if relevant)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or errors
      description: Include only relevant, sanitized information.
