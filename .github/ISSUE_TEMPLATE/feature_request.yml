name: Feature request
description: Describe a problem and desired behavior / 功能建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: markdown
    attributes:
      value: Check the roadmap in GitHub Projects or docs/ROADMAP.md. Do not include real team data or credentials. 中文反馈也欢迎。
