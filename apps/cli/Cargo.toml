[package]
name = "coflow"
version = "0.7.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Command-line client for CoFlow"

[dependencies]
chrono = "=0.4.39"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.134"
sha2 = "0.10"
tempfile = "=3.14.0"
ureq = { version = "=2.10.1", default-features = false, features = ["tls", "json", "native-certs"] }
url = "=2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=2.11.1"
